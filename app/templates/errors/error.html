{% extends "base.html" %}
{% block title %}错误 {{ code }} · 测试用例自动生成与管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center py-5">
    <div class="display-4 fw-bold text-primary mb-2">{{ code }}</div>
    <p class="text-muted mb-4">{{ message }}</p>
    <a class="btn btn-outline-primary" href="{{ url_for('main.dashboard') }}">
      <i class="bi bi-house"></i> 返回工作台
    </a>
  </div>
</div>
{% endblock %}
